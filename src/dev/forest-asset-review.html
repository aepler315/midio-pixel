<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest asset review</title>
<style>
  html, body { margin: 0; background: #20242a; color: #ddd; font: 13px system-ui, sans-serif; }
  canvas { display: block; }
  #note { position: absolute; left: 8px; top: 6px; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="note"></div>
<script type="module">
  // Developer-only review of the near conifer assets (natural-rendering
  // Task 2): the production forest shaders and instancing on neutral ground,
  // with no terrain, so a tree can be judged close, oblique and backlit.
  //   ?shot=close|oblique|stand|backlit  &lod=0|1  &w=1280&h=720  &debug=1
  // Window.__REVIEW_READY becomes true after the first frame.
  import * as THREE from '../vendor/range/three-range.module.js';
  import { sceneUniforms, setLinearFromHex } from '../world/alpine/TerrainMaterial.js';
  import { createForest } from '../world/alpine/ForestGL.js';

  const q = new URLSearchParams(location.search);
  const shot = q.get('shot') || 'close';
  const W = Number(q.get('w')) || 1280, H = Number(q.get('h')) || 720;
  const lod = q.get('lod') === '1' ? 1 : 0;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  document.body.appendChild(renderer.domElement);
  const u = sceneUniforms(THREE, {});
  const sky = { zenith: '#4f7fb8', horizon: '#c9d8e6' };
  setLinearFromHex(u.uSkyZenith.value, sky.zenith);
  setLinearFromHex(u.uSkyHorizon.value, sky.horizon);
  setLinearFromHex(u.uAirColor.value, sky.horizon);
  setLinearFromHex(u.pForestNear.value, '#2c4a2e');
  setLinearFromHex(u.pForestFar.value, '#3b5446');
  u.uAirDensity.value = 1 / 90000;
  u.uAmbientScale.value = 1.6;
  u.uExposure.value = 1.6;
  u.uSolarTransmission.value = 0.6;
  const backlit = shot === 'backlit';
  u.uLightDir.value.set(backlit ? -0.2 : 0.55, backlit ? 0.22 : 0.62, backlit ? -0.95 : 0.45).normalize();
  u.uLightColor.value.setRGB(1.35, 1.22, 1.0);

  // A small stand on flat ground: species and ids vary; the detail ring
  // (lod 0) or the mesh ring's lighter asset (lod 1) for every tree.
  const rows = [];
  let n = 0;
  for (let gz = -6; gz <= 6; gz++) for (let gx = -6; gx <= 6; gx++) {
    const h = Math.abs(Math.sin(gx * 12.9898 + gz * 78.233) * 43758.5453) % 1;
    if ((gx || gz) && h < 0.35) continue;
    const id = (Math.abs(Math.sin(gx * 39.3468 + gz * 11.135) * 24634.6345) % 1);
    const species = gx === 0 && gz === 0 ? 1 : n % 4;
    const height = [20, 26, 18, 25][species] * (0.8 + 0.4 * h);
    const ratio = [0.28, 0.36, 0.25, 0.4][species];
    rows.push(gx * 11 + (h - .5) * 6, 0, gz * 11 + (id - .5) * 6, height, height * ratio, species, id, 2);
    n++;
  }
  const data = new Float32Array(rows);
  const placed = lod === 0 ? { meshDetail: data, mesh: new Float32Array(), billboard: new Float32Array(), count: n, stride: 8 }
    : { meshDetail: new Float32Array(), mesh: data, billboard: new Float32Array(), count: n, stride: 8 };
  const forest = createForest(THREE, placed, u, { partitioned: false, forestDebug: q.get('debug') === '1' });
  const scene = new THREE.Scene();
  for (const m of forest.byBand.near) scene.add(m);

  // The local Three subset has no primitive geometry classes: plain buffers.
  const quad = (positions) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3)); return g; };
  const ground = new THREE.Mesh(quad([-4000, 0, -4000, -4000, 0, 4000, 4000, 0, 4000, -4000, 0, -4000, 4000, 0, 4000, 4000, 0, -4000]), new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms: u,
    vertexShader: `out vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `precision highp float; uniform vec3 uLightDir; uniform vec3 uLightColor; uniform vec3 uSkyZenith; uniform vec3 uSkyHorizon; uniform vec3 uCameraPos;
      in vec3 vW; out vec4 o;
      void main(){ vec3 a = vec3(.16,.15,.11); float k = max(uLightDir.y, 0.0);
        vec3 c = a * (uSkyZenith * .9 + uLightColor * k);
        float d = length(vW - uCameraPos); c = mix(c, uSkyHorizon * .9, 1.0 - exp(-d / 3000.0));
        o = vec4(pow(c, vec3(1.0/2.2)), 1.0); }`,
  }));
  scene.add(ground);
  // Sky: a full-screen triangle behind everything, by view direction.
  const skyMesh = new THREE.Mesh(quad([-1, -1, 0, 3, -1, 0, -1, 3, 0]), new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, uniforms: { ...u, uInvViewProj: { value: new THREE.Matrix4() } }, depthWrite: false, depthTest: false,
    vertexShader: `out vec2 vNdc; void main(){ vNdc = position.xy; gl_Position = vec4(position.xy, 1.0, 1.0); }`,
    fragmentShader: `precision highp float; uniform vec3 uSkyZenith; uniform vec3 uSkyHorizon; uniform vec3 uLightDir; uniform mat4 uInvViewProj; uniform vec3 uCameraPos; in vec2 vNdc; out vec4 o;
      void main(){ vec4 p = uInvViewProj * vec4(vNdc, 1.0, 1.0); vec3 d = normalize(p.xyz / p.w - uCameraPos);
        vec3 c = mix(uSkyHorizon, uSkyZenith, smoothstep(0.0, 0.5, d.y)); c += vec3(1.0,.9,.7) * pow(max(dot(d, uLightDir), 0.0), 400.0) * 4.0;
        o = vec4(pow(c, vec3(1.0/2.2)), 1.0); }`,
  }));
  skyMesh.frustumCulled = false; skyMesh.renderOrder = -1;
  scene.add(skyMesh);

  const camera = new THREE.PerspectiveCamera(35, W / H, 0.5, 30000);
  const shots = {
    close: { eye: [0, 7, 22], target: [0, 9, 0] },
    oblique: { eye: [-40, 32, 70], target: [0, 8, 0] },
    stand: { eye: [-30, 60, 190], target: [0, 4, 0] },
    backlit: { eye: [0, 6, 34], target: [0, 12, 0] },
  };
  const s = shots[shot] || shots.close;
  camera.position.fromArray(s.eye);
  camera.lookAt(...s.target);
  camera.updateMatrixWorld();
  u.uCameraPos.value.copy(camera.position);
  u.uViewportPx.value.set(W, H);
  u.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  u.uTime.value = 0;
  skyMesh.material.uniforms.uInvViewProj.value.copy(u.uViewProj.value).invert();
  renderer.render(scene, camera);
  const gl = renderer.getContext();
  document.getElementById('note').textContent = `${shot} · lod ${lod} · ${n} trees · ${(forest.assets || []).map(a => `${a.family}/${a.variant}:${a.triangles}t`).join(' ')}`;
  window.__REVIEW = { trees: n, assets: forest.assets || null, error: gl.getError() };
  window.__REVIEW_READY = true;
</script>
</body>
</html>
