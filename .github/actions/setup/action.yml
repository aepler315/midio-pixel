# Shared job setup: Node, the locked dependencies, and optionally Chromium.
#
# Every job in test.yml and static.yml began with the same steps, copied by
# hand. Copies drift -- a version bumped in one job and not the next -- and
# the audit step had been copied into jobs that did not need it, so the same
# lockfile was audited three times per pull request. Checkout stays in each
# job, because a local action can only be read from a checked-out tree.
name: Set up the game
description: Install Node and the locked dependencies, and optionally Chromium.
inputs:
  browser:
    description: Also install Chromium and its system dependencies for Playwright.
    default: 'false'
runs:
  using: composite
  steps:
    # Browser smokes render through SwiftShader on the CPU, so their time
    # scales with cores. Hosted runners give private repositories half the
    # cores of public ones; log what this job got so budgets can be read
    # against it.
    - name: Report runner resources
      shell: bash
      run: |
        echo "Runner resources: $(nproc) CPUs, $(free -g | awk '/^Mem:/{print $2}') GiB RAM"
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: npm
    - name: Install game dependencies
      shell: bash
      run: npm ci --no-fund
    - name: Install Chromium
      if: inputs.browser == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
