# Optional hosted validation. Routine validation runs locally; no automatic events.
name: Test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm --prefix ridgeview test
      - name: Stage the public application
        run: npm run stage:site
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
        with:
          browser: true
      - name: Exercise upload, playback and the staged application
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 PORT=8080 node tools/serve.js > .smoke/core-server.log 2>&1 &
          source_pid=$!
          trap 'kill "$source_pid" "${staged_pid:-}" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ > /dev/null
          npm run test:smoke -- http://127.0.0.1:8080
          npm run stage:site
          SITE_ROOT=_site HOST=127.0.0.1 PORT=8090 node tools/serve.js > .smoke/core-staged.log 2>&1 &
          staged_pid=$!
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8090/ > /dev/null
          npm run test:bootstrap -- http://127.0.0.1:8090
          npm run test:routes -- --site-root _site --out .smoke/current-routes
      - name: Retain browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-browser-smoke
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
