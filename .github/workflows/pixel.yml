name: Pixel validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  depth-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        with:
          browser: true
      - name: Render depth-aware pixel terrain
        run: npm run visual:eval -- --manifest test/fixtures/visual-evaluation-depth.json --out .smoke/pixel-depth
      - name: Verify production depth shader pixels
        run: node --test test/pixelDepthShader.test.mjs
      - name: Retain pixel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pixel-depth
          path: .smoke/pixel-depth/
          include-hidden-files: true
          retention-days: 7
