# Long browser regressions remain available independently of the core PR gate.
name: Extended browser validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game
        uses: ./.github/actions/setup
        with:
          browser: true
      - name: Exercise audio upload and playback
        run: |
          mkdir -p .smoke
          HOST=127.0.0.1 node tools/serve.js > .smoke/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          npm run test:smoke -- http://127.0.0.1:8080
          npm run test:trio -- http://127.0.0.1:8080
          npm run test:lighting -- http://127.0.0.1:8080
          npm run test:shading -- http://127.0.0.1:8080
          npm run test:seek -- http://127.0.0.1:8080
          npm run test:worlds -- http://127.0.0.1:8080
          npm run test:export -- http://127.0.0.1:8080
          npm run test:car -- http://127.0.0.1:8080
          npm run test:urlload -- http://127.0.0.1:8080
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: audio-smoke
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7


  plex-smoke:
    runs-on: ubuntu-latest
    # Range-scene playback steps take about 2 minutes each on SwiftShader
    # runners; the whole smoke now needs about 17 minutes.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game and Chromium
        uses: ./.github/actions/setup
        with:
          browser: true
      - name: Exercise anonymous Plex adapter and actual browser loading
        run: npm run test:plex
      - name: Upload Plex diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plex-smoke
          path: .smoke/plex/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  pixel-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up the game and Chromium
        uses: ./.github/actions/setup
        with:
          browser: true
      - name: Verify real pixel placement, Range backends and export failure
        run: npm run test:retro
      - name: Verify packed cloud uniforms on the GPU
        run: |
          HOST=127.0.0.1 PORT=8082 node tools/serve.js > .smoke/cloud-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8082/ > /dev/null
          node tools/cloud-occlusion-smoke.mjs http://127.0.0.1:8082 .smoke/retro/cloud-packed.json
      - name: Upload pixel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pixel-presentation
          path: .smoke/retro/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
